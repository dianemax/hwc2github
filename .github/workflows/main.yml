name: get-huaweicloud-oidc-token

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  dump-token:
    runs-on: ubuntu-latest
    env:
      AUDIENCE: huaweicloud
    steps:
      - name: Get OIDC id_token
        run: |
          ID_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${AUDIENCE}" \
            | jq -r '.value')
          
          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "::error::Failed to get id_token"
            exit 1
          fi
          
          echo "$ID_TOKEN" > id_token.txt
          echo "Token saved, size: $(wc -c < id_token.txt) bytes"

      - name: Upload token artifact
        uses: actions/upload-artifact@v4
        with:
          name: huaweicloud-id-token
          path: id_token.txt
          retention-days: 1
