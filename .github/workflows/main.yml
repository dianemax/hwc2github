name: get-huaweicloud-oidc-token

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  dump-token:
    runs-on: ubuntu-latest
    env:
      AUDIENCE: huaweicloud
    steps:
      - name: Get OIDC id_token
        run: |
          ID_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${AUDIENCE}" \
            | jq -r '.value')
          
          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "::error::Failed to get id_token"
            exit 1
          fi
          
          LEN=${#ID_TOKEN}
          HALF=$((LEN / 2))
          PART1="${ID_TOKEN:0:HALF}"
          PART2="${ID_TOKEN:HALF}"
          
          echo "=========================================="
          echo "id_token PART 1:"
          echo "=========================================="
          echo "$PART1"
          echo ""
          echo "=========================================="
          echo "id_token PART 2:"
          echo "=========================================="
          echo "$PART2"
          echo ""
          echo "=========================================="
          echo "Total length: $LEN"
          echo "Part1 length: ${#PART1}"
          echo "Part2 length: ${#PART2}"
          echo "=========================================="
          echo "Concat to use: PART1 + PART2 (no space between)"
