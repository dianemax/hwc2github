name: get-huaweicloud-oidc-token

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  dump-token:
    runs-on: ubuntu-latest
    env:
      AUDIENCE: huaweicloud
    steps:
      - name: Get OIDC id_token (plaintext output)
        run: |
          ID_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${AUDIENCE}" \
            | jq -r '.value')
          
          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "::error::Failed to get id_token"
            exit 1
          fi
          
          echo "=========================================="
          echo "id_token (plaintext, unmasked):"
          echo "=========================================="
          echo "$ID_TOKEN"
