name: hwc2github

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # 允许手动触发，方便联调

permissions:
  id-token: write          # ★★★ 关键：允许签发 OIDC id_token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: 	iam::b67ca5a59dd3495ba0b61a2bd451bf19:agency:agency-hwc2github1   # ★ 替换成你的 Role ARN
          role-session-name: github-actions-deploy
          # aws-region: ap-southeast-1                                     # ★ 替换成你的区域

      - name: Verify identity
        run: aws sts get-caller-identity
